<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひらがなチェッカー</title>

<style>
body{
    font-family:sans-serif;
    max-width:700px;
    margin:auto;
    padding:20px;
    background:#fafafa;
}

h1{
    text-align:center;
}

.controls{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

input{
    flex:1;
    padding:10px;
    font-size:18px;
}

button{
    padding:10px 16px;
    font-size:16px;
    cursor:pointer;
}

#count{
    margin-bottom:15px;
    font-size:18px;
    text-align:center;
}

.grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.cell{
    border:1px solid #ccc;
    border-radius:10px;
    padding:15px 0;
    text-align:center;
    font-size:24px;
    background:white;
    cursor:pointer;
    user-select:none;
}

.off{
    background:#d3d3d3;
    color:#888;
    text-decoration:line-through;
}
</style>
</head>

<body>

<h1>ひらがなチェッカー</h1>

<div id="count"></div>

<div class="controls">
    <input
        id="wordInput"
        placeholder="ひらがなを入力"
        onkeydown="if(event.key==='Enter') useWord()"
    >
    <button onclick="useWord()">適用</button>
    <button onclick="resetAll()">リセット</button>
</div>

<div class="grid" id="grid"></div>

<script>

const chars = [

"あ","い","う","え","お",
"ぁ","ぃ","ぅ","ぇ","ぉ",

"か","き","く","け","こ",
"が","ぎ","ぐ","げ","ご",

"さ","し","す","せ","そ",
"ざ","じ","ず","ぜ","ぞ",

"た","ち","つ","て","と",
"だ","ぢ","づ","で","ど",
"っ",

"な","に","ぬ","ね","の",

"は","ひ","ふ","へ","ほ",
"ば","び","ぶ","べ","ぼ",
"ぱ","ぴ","ぷ","ぺ","ぽ",

"ま","み","む","め","も",

"や","ゆ","よ",
"ゃ","ゅ","ょ",

"ら","り","る","れ","ろ",

"わ","を","ん",
"ゎ"
];

const grid = document.getElementById("grid");

chars.forEach(char => {

    const div = document.createElement("div");

    div.className = "cell";
    div.textContent = char;
    div.id = "char-" + char;

    div.onclick = () => {
        div.classList.toggle("off");
        updateCount();
    };

    grid.appendChild(div);

});

function useWord(){

    const text =
        document.getElementById("wordInput")
        .value
        .trim();

    for(const ch of text){

        const cell =
            document.getElementById("char-" + ch);

        if(cell){
            cell.classList.add("off");
        }
    }

    document.getElementById("wordInput").value = "";

    updateCount();
}

function updateCount(){

    const used =
        document.querySelectorAll(".off").length;

    document.getElementById("count").textContent =
        `${used} / ${chars.length}文字使用`;
}

function resetAll(){

    document.querySelectorAll(".cell")
    .forEach(cell =>
        cell.classList.remove("off"));

    updateCount();
}

updateCount();

</script>

</body>
</html>
