<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひらがなチェッカー</title>

<style>
body{
    font-family:sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
    background:#fafafa;
}

h1{
    text-align:center;
}

#count{
    text-align:center;
    font-size:18px;
    margin:15px 0;
    font-weight:bold;
}

.controls{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

input{
    flex:1;
    padding:12px;
    font-size:18px;
}

button{
    padding:12px 20px;
    font-size:16px;
    cursor:pointer;
}

.grid{
    display:grid;
    grid-template-columns:repeat(5,70px);
    justify-content:center;
    gap:8px;
}

.cell{
    border:1px solid #ccc;
    border-radius:10px;
    text-align:center;
    padding:15px 0;
    font-size:24px;
    background:white;
    cursor:pointer;
    user-select:none;
}

.cell:hover{
    background:#f3f3f3;
}

.off{
    background:#d3d3d3;
    color:#888;
    text-decoration:line-through;
}

.blank{
    visibility:hidden;
}

.break-space{
    grid-column:1 / -1;
    height:20px;
}
</style>
</head>

<body>

<h1>ひらがなチェッカー</h1>

<div id="count"></div>

<div class="controls">
    <input
        id="wordInput"
        placeholder="ひらがなを入力"
        onkeydown="if(event.key==='Enter') useWord()"
    >
    <button onclick="useWord()">適用</button>
    <button onclick="resetAll()">リセット</button>
</div>

<div class="grid" id="grid"></div>

<script>

const chars = [

"あ","か","さ","た","な",
"い","き","し","ち","に",
"う","く","す","つ","ぬ",
"え","け","せ","て","ね",
"お","こ","そ","と","の",

"BREAK",

"ま","は","や","ら","わ",
"み","ひ","","り","を",
"む","ふ","ゆ","る","ん",
"め","へ","","れ","",
"も","ほ","よ","ろ","",

"BREAK",

"が","ざ","だ","ば","ぱ",
"ぎ","じ","ぢ","び","ぴ",
"ぐ","ず","づ","ぶ","ぷ",
"げ","ぜ","で","べ","ぺ",
"ご","ぞ","ど","ぼ","ぽ",

"BREAK",

"ぁ","ゃ","っ","","",
"ぃ","","ゅ","ゎ","",
"ぅ","","ょ","","",
"ぇ","","","","",
"ぉ","","","",""

];

const grid = document.getElementById("grid");

chars.forEach(char => {

    if(char === "BREAK"){
        const spacer = document.createElement("div");
        spacer.className = "break-space";
        grid.appendChild(spacer);
        return;
    }

    const div = document.createElement("div");

    if(char === ""){
        div.className = "blank";
        grid.appendChild(div);
        return;
    }

    div.className = "cell";
    div.textContent = char;
    div.id = "char-" + char;

    div.onclick = () => {
        div.classList.toggle("off");
        updateCount();
    };

    grid.appendChild(div);
});

function useWord(){

    const text =
        document.getElementById("wordInput")
        .value
        .trim();

    for(const ch of text){

        const cell =
            document.getElementById("char-" + ch);

        if(cell){
            cell.classList.add("off");
        }
    }

    document.getElementById("wordInput").value = "";

    updateCount();
}

function updateCount(){

    const used =
        document.querySelectorAll(".off").length;

    const total =
        document.querySelectorAll(".cell").length;

    document.getElementById("count").textContent =
        `${used} / ${total}文字使用`;
}

function resetAll(){

    document.querySelectorAll(".cell")
        .forEach(cell =>
            cell.classList.remove("off")
        );

    updateCount();
}

updateCount();

</script>

</body>
</html>
